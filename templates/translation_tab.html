<!-- --- templates/translation_tab.html --- -->
<style>
    /* Two-Column Layout */
    .workspace-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        align-items: start;
    }
    /* Input & Results */
    .lyric-workspace-card {
        text-align: center;
        padding: 30px 20px;
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 10px;
    }
             
    .translation-line {
        font-size: 1.1rem;
        font-weight: 700;
        color: #333;
        margin-bottom: 20px;
        line-height: 1.4;
    }
    .original-line {
        font-size: 1.6rem;
        font-weight: 600;
        color: #000;
        line-height: 1.6;
        word-wrap: break-word;
        white-space: pre-wrap;
        text-align: center;
    }
    /* Word Block Layout */
    .word-block {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        vertical-align: top;
        margin: 0 6px 15px 6px;
    }
    .word-orig {
        color: #000;
        line-height: 1.1;
    }
    .word-pron {
        color: var(--primary);
        font-size: 0.95rem;
        font-family: monospace;
        font-weight: 500;
        letter-spacing: 0.5px;
        margin-top: 2px;
        line-height: 1.1;
    }
    /* Execution Terminal */
    .terminal-wrapper {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    .terminal-header {
        background: #343a40;
        color: #fff;
        padding: 8px 15px;
        font-size: 0.85rem;
        font-weight: bold;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .execution-terminal {
        background: #0d1117;
        color: #00ff00;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        padding: 15px;
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
        height: 400px;
        overflow-y: auto;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        border: 1px solid #343a40;
        border-top: none;
        white-space: pre-wrap;
    }
             
    .term-sys { color: #8a2be2; font-weight: bold; }
    .term-err { color: #ff4444; }
    .term-match { color: #00ffff; font-weight: bold; }
</style>

<div id="translation-tab-content" style="display: none;">
    <div class="section-title" style="margin-bottom: 20px;">Translation & Brute-Force Alignment Workspace</div>
             
    <div class="workspace-grid">
        <!-- LEFT COLUMN: Input Only -->
        <div>
            <textarea id="trans-input" placeholder="Type mixed text here..." style="min-height: 150px; font-size: 1rem; width: 100%; padding: 15px; box-sizing: border-box;"></textarea>
                                     
            <div id="trans-status-indicator" style="font-size: 0.85rem; color: var(--text-sub); margin-top: 8px; display: none; align-items: center; gap: 8px;">
                <div class="spinner" style="width: 14px; height: 14px; border-width: 2px;"></div>
                <span id="status-msg">Translating automatically...</span>
            </div>
        </div>
        <!-- RIGHT COLUMN: Execution Terminal -->
        <div class="terminal-wrapper">
            <div class="terminal-header">Backend Execution Console</div>
            <div id="terminal-output" class="execution-terminal">
                <span class="term-sys">System Ready. Awaiting input for alignment...</span><br>
            </div>
        </div>
    </div>
    <!-- FULL WIDTH BOTTOM: Results Card -->
    <div id="trans-results-card" class="lyric-workspace-card" style="display: none; margin-top: 25px;">
        <div class="metadata-header" style="justify-content: center; margin-bottom: 15px; color: var(--text-sub);">
            <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">
                Detected: <strong id="res-lang" style="color: var(--primary);"></strong>
            </span>
        </div>
        <div id="res-trans" class="translation-line">-</div>
        <div id="res-aligned-text" class="original-line"></div>
    </div>
</div>

<script>
    const transInput = document.getElementById('trans-input');
    const resultsCard = document.getElementById('trans-results-card');
    const statusIndicator = document.getElementById('trans-status-indicator');
    const statusMsg = document.getElementById('status-msg');
    const terminal = document.getElementById('terminal-output');
             
    let activeController = null;
    const translationCache = new Map();

    function logTerm(msg, type = '') {
        let span = document.createElement('span');
        if (type) span.className = type;
        span.innerText = msg;
        terminal.appendChild(span);
        terminal.appendChild(document.createElement('br'));
        terminal.scrollTop = terminal.scrollHeight;
    }

    function logToTermArray(arr, word_gotten) {
        const textArr = arr.map(a => a.text);
        logTerm(`Current State: ['${textArr.join("', '")}'] [ ${word_gotten} ]\n`);
    }

    ['input', 'paste'].forEach(eventType => {
        transInput.addEventListener(eventType, () => {
            if (activeController) activeController.abort();
            const textValue = transInput.value.trim();
            if (!textValue) {
                statusIndicator.style.display = 'none';
                resultsCard.style.display = 'none';
                return;
            }
            statusIndicator.style.display = 'flex';
            statusMsg.innerText = "Analyzing text...";
            resultsCard.style.display = 'none';
            
            // Execute instantly without any debounce delay
            runAutoTranslation(textValue);
        });
    });

    async function fetchTranslation(text, signal, retries = 1) {
        if (translationCache.has(text)) {
            return translationCache.get(text);
        }
        for (let i = 0; i <= retries; i++) {
            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text }),
                    signal: signal
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                translationCache.set(text, data);
                return data;
            } catch (err) {
                if (signal.aborted) throw err;
                if (i === retries) throw err;
                // Artificial delay removed for instant retries
            }
        }
    }

    function isSpacelessScript(str) {
        return /[\u3000-\u303f\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff66-\uff9f\uac00-\ud7af\u0e00-\u0e7f\uff00-\uffef]/.test(str);
    }

    // Exact replicas of Python p1 and p2 punctuation maps
    function cleanPunctuationPythonStyle(str) {
        if (!str) return '';
        return str.replace(/['!"(),*+.:%;<!¬~=>?\[\\\]^_`।{|}~،؟¿¡”（）‘’？！\-]/g, '').trim();
    }

    function extractPunctuationMap(block) {
        const punctuationRegex = /[\p{P}\p{S}\u3000-\u303f\uff00-\uff0f\uff1a-\uff20\uff3b-\uff40\uff5b-\uff65]/u;
        let cleanText = '';
        let punctMap = [];
        let currentPrefix = '';
        for (let i = 0; i < block.length; i++) {
            const char = block[i];
            if (punctuationRegex.test(char)) {
                if (cleanText.length === 0) {
                    currentPrefix += char;
                } else {
                    if (!punctMap[cleanText.length - 1]) {
                        punctMap[cleanText.length - 1] = { prefix: '', suffix: '' };
                    }
                    punctMap[cleanText.length - 1].suffix += char;
                }
            } else {
                cleanText += char;
                punctMap.push({ prefix: currentPrefix, suffix: '' });
                currentPrefix = '';
            }
        }
        if (cleanText.length === 0 && currentPrefix.length > 0) {
            return { cleanText: '', purePunctuation: currentPrefix, punctMap: [] };
        }
        return { cleanText, purePunctuation: null, punctMap };
    }

    /*
     * PRECISE PORT OF PYTHON chinese_and_japanese(line) BRUTE FORCE ALGORITHM
     */
    async function runBruteForceAlignment(line, fullPron, signal) {
        logTerm(`\n[INIT] Starting brute force on block: ${line}`, 'term-sys');

        const fetchResMain = await fetchTranslation(line.replace(/\s+/g, ''), signal);
        let j = fetchResMain.translation || '';
        let k = fetchResMain.pronunciation || fullPron || fetchResMain.translation || '';

        let pronCleaned = cleanPunctuationPythonStyle(k.toLowerCase());
        let liner_main = pronCleaned.split(/\s+/).filter(t => t.length > 0).reverse();

        logTerm(`Target Array (liner_main): ${JSON.stringify(liner_main)}`, 'term-sys');

        let w = '';
        let character = '';
        let add_to = [];
        let word_gotten = 0;
        let p = ''; // Maintained outer scope

        const lineChars = Array.from(line).reverse();

        for (let char of lineChars) {
            if (signal.aborted) throw new Error("Aborted");
            character = char;
            w = character + w;

            let contextStr = `(${line}) — ${w}`;
            let fetchRes = await fetchTranslation(contextStr, signal);
            let rawP = fetchRes.pronunciation || fetchRes.translation || '';

            let parts = rawP.toLowerCase().split('—');
            let lastSegment = parts[parts.length - 1].replace(/^[-.,]+/, '').trim();
            p = cleanPunctuationPythonStyle(lastSegment); 

            let liner = liner_main.slice(word_gotten, word_gotten + 1);

            logTerm(`[ ${w} ] <-- [ ${character} ]                  [ ${p} ] <--> ${JSON.stringify(liner)}  [ ${word_gotten} ]`);

            // --- TYPE 1: Natural match ---
            if (liner.length > 0 && p === liner[0]) {
                logTerm(`------type 1----------natural match---------`, 'term-match');
                add_to.unshift({ text: w, pron: liner[0] });
                w = '';
                word_gotten++;
                logToTermArray(add_to, word_gotten);
                continue;
            }

            // --- TYPE 2: Separately match ---
            if (liner.length > 0 && p.replace(/\s+/g, '') === liner[0]) {
                logTerm(`------type 2----------separately match---------`, 'term-match');
                add_to.unshift({ text: w, pron: liner[0] });
                w = '';
                word_gotten++;
                logToTermArray(add_to, word_gotten);
                continue;
            }

            // --- TYPE Y: Residual trailing match ---
            if (liner.length === 0) {
                logTerm(`------type Y----------residual trailing match---------`, 'term-match');
                if (add_to.length > 0) {
                    add_to[0].text = w + add_to[0].text;
                } else {
                    add_to.unshift({ text: w, pron: '' });
                }
                w = '';
                logToTermArray(add_to, word_gotten);
                continue;
            }

            // --- TYPE 4 & TYPE 5: Multiple words returned in p ---
            let pSplit = p.split(/\s+/).filter(x => x.length > 0);
            if (pSplit.length > 1) {
                if (pSplit.length === 2 && w.length === 2 && liner.length > 0 && pSplit[pSplit.length - 1] === liner[0]) {
                    logTerm(`------type 4----------second word match---------`, 'term-match');
                    add_to.unshift({ text: w.substring(1), pron: liner[0] });
                    w = w[0];
                    word_gotten++;
                    logToTermArray(add_to, word_gotten);
                }

                let linerCurrent = liner_main.slice(word_gotten, word_gotten + 1);
                if (linerCurrent.length > 0 && pSplit[0] === linerCurrent[0]) {
                    logTerm(`------type 5----------further second word match---------`, 'term-match');
                    add_to.unshift({ text: w, pron: linerCurrent[0] });
                    w = '';
                    word_gotten++;
                    logToTermArray(add_to, word_gotten);
                    continue;
                } else {
                    continue;
                }
            }
        }

        // --- POST-LOOP RESIDUAL HANDLING ---
        if (w !== '') {
            logTerm(`[ ${w} ] <-- [ ${character} ]                  [ ${p} ] <--> ${JSON.stringify(liner_main.slice(word_gotten, word_gotten + 1))}`);
            logTerm(`------type X----------bad match---------`, 'term-err');
            w = w.trim();
            let wSplit = w.split(/\s+/).filter(x => x.length > 0);

            if (wSplit.length === p.length) {
                for (let item of wSplit.slice().reverse()) {
                    add_to.unshift({ text: w, pron: liner_main[word_gotten] || '' });
                    word_gotten++;
                }
            } else {
                logTerm(`------type MEGA ULTRA PSYCHO CRAZY ULTIMATE----------bad match---------`, 'term-err');
                let line1 = w;
                // let fetchRes1 = await fetchTranslation(line1, signal);
                // let j1 = fetchRes1.translation || '';
                // let k1 = fetchRes1.pronunciation || fetchRes1.translation || '';
                // let pron1 = cleanPunctuationPythonStyle(k1.toLowerCase());
                let liner_main1 = liner_main.slice(word_gotten).reverse();

                let w1 = '';
                let character1 = '';
                let add_to1 = [];
                let word_gotten1 = 0;

                for (let char1 of Array.from(line1)) {
                    character1 = char1;
                    w1 = w1 + character1;
                    let fetchRes11 = await fetchTranslation(`(${line1}) — ${w1}`, signal);
                    let rawP11 = fetchRes11.pronunciation || fetchRes11.translation || '';
                    let parts11 = rawP11.toLowerCase().split('—');
                    let lastSegment11 = parts11[parts11.length - 1].replace(/^[-.,]+/, '').trim();
                    let p11 = cleanPunctuationPythonStyle(lastSegment11);

                    let liner1 = liner_main1.slice(word_gotten1, word_gotten1 + 1);
                    logTerm(`[ ${w1} ] <-- [ ${character1} ]                  [ ${p11} ] <--> ${JSON.stringify(liner1)}  [ ${word_gotten1} ]`);

                    if (liner1.length > 0 && p11 === liner1[0]) {
                        logTerm(`------type 1----------natural match---------`, 'term-match');
                        add_to1.push({ text: w1, pron: liner1[0] });
                        w1 = '';
                        word_gotten1++;
                        logToTermArray(add_to1, word_gotten1);
                        continue;
                    }
                }

                if (w1 !== '') {
                    add_to1.push({ text: w1, pron: liner_main1[word_gotten1] || '' });
                }

                add_to = add_to1.concat(add_to);
            }
            logToTermArray(add_to, word_gotten);
        }

        return add_to;
    }

    async function runAutoTranslation(textInput) {
        activeController = new AbortController();
        const signal = activeController.signal;
        try {
            terminal.innerHTML = '';
            logTerm(`System Ready. Awaiting input...`, 'term-sys');
                         
            // 1. Fetch full string translation for the top display
            const fullData = await fetchTranslation(textInput, signal);
            document.getElementById('res-lang').innerText = fullData.srcLang || 'Unknown';
            document.getElementById('res-trans').innerText = fullData.translation || 'N/A';
                         
            statusMsg.innerText = "Executing Word-by-Word Analysis...";
                                             
            // 2. Process ALL texts word-by-word natively
            const blocks = textInput.split(/\s+/).filter(b => b.length > 0);
            
            async function processBlock(block) {
                logTerm(`\n[ANALYZING BLOCK] "${block}"`, 'term-sys');
                                     
                const { cleanText, purePunctuation, punctMap } = extractPunctuationMap(block);
                if (purePunctuation) {
                    logTerm(`-> Pure punctuation block. Outputting directly.`, 'term-match');
                    return `<span class="word-block"><span class="word-orig">${purePunctuation}</span></span>`;
                }
                
                const blockData = await fetchTranslation(cleanText, signal);
                let blockLang = blockData.srcLang || 'auto';
                
                // 3. Conditional gate: Is it an Asian script AND registered as an Asian language?
                let isAsianScript = isSpacelessScript(cleanText);
                let isAsianLang = blockLang.startsWith('zh') || blockLang === 'ja' || blockLang === 'ko';

                if (isAsianLang && isAsianScript) {
                    let blockPron = blockData.pronunciation || blockData.translation || cleanText;
                    const cleanPron = cleanPunctuationPythonStyle(blockPron);
                    const pronTokens = cleanPron.trim().split(/\s+/).filter(t => t.length > 0);
                                             
                    let alignedItems = [];
                    if (pronTokens.length <= 1) {
                        logTerm(`-> Pronunciation is 1 block or less. Skipping brute-force.`, 'term-match');
                        alignedItems = [{ text: cleanText, pron: cleanPron }];
                    } else {
                        logTerm(`-> Detected ${blockLang} with ${pronTokens.length} syllables. Applying brute-force alignment.`, 'term-match');
                        alignedItems = await runBruteForceAlignment(cleanText, cleanPron, signal);
                    }
                    
                    let html = '';
                    let charOffset = 0;
                    alignedItems.forEach(item => {
                        let itemLength = item.text.length;
                        let prefixPunct = punctMap[charOffset] ? punctMap[charOffset].prefix : '';
                        let suffixPunct = punctMap[charOffset + itemLength - 1] ? punctMap[charOffset + itemLength - 1].suffix : '';
                                                     
                        let restoredText = `${prefixPunct}${item.text}${suffixPunct}`;
                        html += `<span class="word-block"><span class="word-orig">${restoredText}</span><span class="word-pron">${item.pron}</span></span>`;
                        charOffset += itemLength;
                    });
                    return html;
                } else {
                    // 4. Default path for standard space-separated languages (Spanish, Arabic, etc.)
                    logTerm(`-> Detected ${blockLang} (Non-brute-force path). Mapping directly.`, 'term-match');
                    
                    // Display pronunciation (if Arabic/Russian etc.) or meaning/translation (Spanish/French) underneath
                    let displaySub = blockData.pronunciation || blockData.translation || '';
                    
                    // Optional: if the translation is identical to the original word, we can leave it blank to avoid redundancy
                    if (displaySub.toLowerCase() === cleanText.toLowerCase()) {
                        return `<span class="word-block"><span class="word-orig">${block}</span></span>`;
                    }
                    return `<span class="word-block"><span class="word-orig">${block}</span><span class="word-pron">${displaySub}</span></span>`;
                }
            }
                             
            const blockResults = await Promise.all(blocks.map(processBlock));
            const finalFlexHtml = blockResults.join('');
            document.getElementById('res-aligned-text').innerHTML = finalFlexHtml.trim();
            logTerm(`\n[SUCCESS] Full alignment complete.`, 'term-sys');
            resultsCard.style.display = 'block';
        } catch (error) {
            if (error.message !== 'Aborted') {
                logTerm(`[ERROR] ${error.message}`, 'term-err');
                console.error('Translation error:', error);
            }
        } finally {
            statusIndicator.style.display = 'none';
        }
    }
</script>
