<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Studio Downloader</title>
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container" id="main-container" style="transition: max-width 0.3s ease;">
    <h1>Media Studio</h1>
    
    <!-- Segmented Navigation Tabs -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('youtube')">YouTube Downloader</button>
        <button class="tab-btn" onclick="switchTab('deezer')">Deezer Search & Stream</button>
        <button class="tab-btn" onclick="switchTab('translation')">Translator</button>
    </div>

    <!-- YouTube Tab -->
    <div id="youtube-tab-content">
        <form id="download-form">
            <div class="section-title">YouTube URL</div>
            <input type="url" id="video-url" placeholder="Paste YouTube link here..." required>
            
            <div class="section-title">Webshare / Proxy Command (Saved in Browser)</div>
            <textarea id="proxy-input" placeholder="Paste Webshare curl response or proxy string here...&#10;e.g., curl -x http://user:pass@p.webshare.io:8080 or user:pass@ip:port"></textarea>
            <div class="sub-text">Copy from Webshare.io or paste any standard proxy format.</div>

            <div class="section-title">Cookies File (Saved in Browser)</div>
            <input type="file" id="cookies-file" accept=".txt">
            <div id="cookie-status" class="cookie-status"></div>

            <div class="btn-group">
                <button type="button" class="btn-mp4" id="btn-mp4" onclick="startDownload('mp4')">Download MP4</button>
                <button type="button" class="btn-mp3" id="btn-mp3" onclick="startDownload('mp3')">Download MP3</button>
            </div>
            
            <button type="button" class="btn-purge" onclick="purgeAll()">Purge All Settings & Storage</button>
        </form>
    </div>

    <!-- Sub-Template Tabs -->
    {% include 'deezer_tab.html' %}
    {% include 'translation_tab.html' %}

    <!-- Shared Progress & Loading Box -->
    <div id="progress-box" class="progress-box">
        <div class="spinner-row">
            <div id="spinner" class="spinner"></div>
            <div id="status-text">Initializing download...</div>
        </div>
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById('youtube-tab-content').style.display = 'none';
        document.getElementById('deezer-tab-content').style.display = 'none';
        document.getElementById('translation-tab-content').style.display = 'none';

        const mainContainer = document.getElementById('main-container');

        if (tab === 'youtube') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('youtube-tab-content').style.display = 'block';
            mainContainer.style.maxWidth = '560px'; // Reset to default width
        } else if (tab === 'deezer') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('deezer-tab-content').style.display = 'block';
            mainContainer.style.maxWidth = '560px'; // Reset to default width
        } else if (tab === 'translation') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('translation-tab-content').style.display = 'block';
            mainContainer.style.maxWidth = '1200px'; // Expand container for wide workspace
        }
        document.getElementById('progress-box').style.display = 'none';
    }

    const urlInput = document.getElementById('video-url');
    const proxyInput = document.getElementById('proxy-input');
    const cookiesInput = document.getElementById('cookies-file');
    const cookieStatus = document.getElementById('cookie-status');
    const progressBox = document.getElementById('progress-box');
    const progressFill = document.getElementById('progress-fill');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');
    const btnMp4 = document.getElementById('btn-mp4');
    const btnMp3 = document.getElementById('btn-mp3');

    function sanitizeYouTubeUrl(rawUrl) {
        if (!rawUrl) return '';
        try {
            const url = new URL(rawUrl.trim());
            if (url.hostname.includes('youtube.com') && url.searchParams.has('v')) {
                return `https://www.youtube.com/watch?v=${url.searchParams.get('v')}`;
            } else if (url.hostname.includes('youtu.be')) {
                return `https://www.youtube.com/watch?v=${url.pathname.replace('/', '')}`;
            } else if (url.hostname.includes('youtube.com') && url.pathname.includes('/shorts/')) {
                return `https://www.youtube.com/watch?v=${url.pathname.split('/shorts/')[1]}`;
            }
        } catch (e) {
            return rawUrl.trim();
        }
        return rawUrl.trim();
    }

    ['input', 'paste', 'change'].forEach(eventType => {
        urlInput.addEventListener(eventType, () => {
            setTimeout(() => { urlInput.value = sanitizeYouTubeUrl(urlInput.value); }, 10);
        });
    });

    window.addEventListener('DOMContentLoaded', () => {
        proxyInput.value = localStorage.getItem('proxy_input') || '';
        if (localStorage.getItem('cookies_text')) {
            cookieStatus.innerText = 'Saved cookies.txt loaded from browser memory.';
        }
    });

    proxyInput.addEventListener('input', () => {
        localStorage.setItem('proxy_input', proxyInput.value);
    });

    cookiesInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                localStorage.setItem('cookies_text', evt.result);
                cookieStatus.innerText = 'New cookies.txt saved to browser memory!';
            };
            reader.readAsText(file);
        }
    });

    function purgeAll() {
        localStorage.clear();
        urlInput.value = '';
        proxyInput.value = '';
        cookiesInput.value = '';
        cookieStatus.innerText = '';
        progressBox.style.display = 'none';
        alert('All inputs, proxy details, and stored cookies purged successfully!');
    }

    async function startDownload(format) {
        const cleanUrl = sanitizeYouTubeUrl(urlInput.value);
        urlInput.value = cleanUrl;
        if (!cleanUrl) {
            alert('Please enter a valid YouTube URL.');
            return;
        }

        const sessionId = 'session_' + Math.random().toString(36).substring(2, 10);
        btnMp4.disabled = true;
        btnMp3.disabled = true;

        progressBox.style.display = 'block';
        spinner.style.display = 'block';
        progressFill.style.width = '0%';
        statusText.innerText = 'Connecting to YouTube server...';

        const eventSource = new EventSource(`/progress/${sessionId}`);
        eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.message) statusText.innerText = data.message;
            if (data.percent) progressFill.style.width = `${data.percent}%`;
        };

        try {
            const formData = new FormData();
            formData.append('session_id', sessionId);
            formData.append('url', cleanUrl);
            formData.append('format', format);
            formData.append('proxy_input', proxyInput.value.trim());

            if (cookiesInput.files[0]) {
                formData.append('cookies_file', cookiesInput.files[0]);
            } else if (localStorage.getItem('cookies_text')) {
                const blob = new Blob([localStorage.getItem('cookies_text')], { type: 'text/plain' });
                formData.append('cookies_file', blob, 'cookies.txt');
            }

            const response = await fetch('/download', { method: 'POST', body: formData });
            eventSource.close();
            
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || 'Server error occurred');
            }

            progressFill.style.width = '100%';
            spinner.style.display = 'none';
            statusText.innerText = 'Download complete! Check your browser downloads.';

            const disposition = response.headers.get('content-disposition');
            let filename = `download.${format}`;
            if (disposition && disposition.includes('filename=')) {
                filename = disposition.split('filename=')[1].replace(/"/g, '');
            }

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

        } catch (err) {
            eventSource.close();
            spinner.style.display = 'none';
            progressFill.style.width = '0%';
            statusText.innerText = `Error: ${err.message}`;
        } finally {
            btnMp4.disabled = false;
            btnMp3.disabled = false;
        }
    }
</script>
</body>
</html>
